#VRML_SIM R2025a utf8
# template language: javascript
# Duas rodas motorizadas e dois apoios esféricos passivos de baixo atrito.
# Frente: +X; esquerda: +Y; cima: +Z. Medidas em metros.
# As duas primeiras linhas são diretivas do Webots e devem manter esse formato.
PROTO Carrinho [
  # Multiplica as dimensões do robô; o campus utiliza escala 3.
  field SFFloat escala 1
  field SFVec3f translation 0 0 0.061
  field SFRotation rotation 0 0 1 0
  field SFString controller "carrinho_manual"
  field SFBool supervisor FALSE
] {
  %<
    const s = fields.escala.value;
    if (!Number.isFinite(s) || s <= 0)
      throw new Error('escala deve ser positiva e finita');
    // A massa acompanha o volume; o torque também considera o aumento do braço.
    const massa = s * s * s;
    const torque = s * s * s * s;
  >%
  Robot {
    translation IS translation
    rotation IS rotation
    children [
      # Chassi: corpo principal do carrinho.
      Shape {
        appearance PBRAppearance {
          baseColor 0.08 0.35 0.75
          metalness 0
          roughness 0.7
        }
        geometry Box { size %<= 0.24*s >% %<= 0.16*s >% %<= 0.06*s >% }
      }
      Pose {
        # Faixa amarela que identifica visualmente a frente do robô.
        translation %<= 0.10*s >% 0 %<= 0.035*s >%
        children [
          Shape {
            appearance PBRAppearance { baseColor 1 0.75 0 metalness 0 }
            geometry Box { size %<= 0.035*s >% %<= 0.12*s >% %<= 0.012*s >% }
          }
        ]
      }
      HingeJoint {
        # Articulação e motor da roda esquerda.
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 %<= 0.10*s >% 0 }
        device [
          RotationalMotor { name "motor_esquerdo" maxVelocity 10 maxTorque %<= torque >% }
          PositionSensor { name "encoder_esquerdo" }
        ]
        endPoint Solid {
          translation 0 %<= 0.10*s >% 0
          rotation 1 0 0 1.57079632679
          children [
            Shape {
              appearance DEF BORRACHA PBRAppearance {
                baseColor 0.035 0.035 0.04
                roughness 1
                metalness 0
              }
              geometry DEF RODA Cylinder { radius %<= 0.06*s >% height %<= 0.025*s >% subdivision 32 }
            }
          ]
          name "roda_esquerda"
          boundingObject USE RODA
          physics Physics { density -1 mass %<= 0.08*massa >% }
        }
      }
      HingeJoint {
        # Articulação e motor da roda direita.
        jointParameters HingeJointParameters { axis 0 1 0 anchor 0 %<= -0.10*s >% 0 }
        device [
          RotationalMotor { name "motor_direito" maxVelocity 10 maxTorque %<= torque >% }
          PositionSensor { name "encoder_direito" }
        ]
        endPoint Solid {
          translation 0 %<= -0.10*s >% 0
          rotation 1 0 0 1.57079632679
          children [
            Shape { appearance USE BORRACHA geometry USE RODA }
          ]
          name "roda_direita"
          boundingObject USE RODA
          physics Physics { density -1 mass %<= 0.08*massa >% }
        }
      }
      # Sensores embarcados de percepção e navegação autônoma.
      GPS {
        name "gps"
        translation 0 0 %<= 0.04*s >%
      }
      InertialUnit {
        name "imu"
      }
      DistanceSensor {
        name "ds_frente"
        translation %<= 0.12*s >% 0 %<= 0.01*s >%
        rotation 0 0 1 0
        lookupTable [ 0 0 0, 2 2000 0 ]
      }
      DistanceSensor {
        name "ds_esquerda"
        translation %<= 0.10*s >% %<= 0.08*s >% %<= 0.01*s >%
        rotation 0 0 1 0.785398
        lookupTable [ 0 0 0, 2 2000 0 ]
      }
      DistanceSensor {
        name "ds_direita"
        translation %<= 0.10*s >% %<= -0.08*s >% %<= 0.01*s >%
        rotation 0 0 1 -0.785398
        lookupTable [ 0 0 0, 2 2000 0 ]
      }
      Solid {
        # Apoio dianteiro passivo: ajuda a manter o chassi equilibrado.
        translation %<= 0.09*s >% 0 %<= -0.04*s >%
        children [
          Shape { appearance USE BORRACHA geometry DEF APOIO Sphere { radius %<= 0.02*s >% } }
        ]
        name "apoio_dianteiro"
        contactMaterial "apoio"
        boundingObject USE APOIO
        physics Physics { density -1 mass %<= 0.01*massa >% }
      }
      Solid {
        # Apoio traseiro passivo, com o mesmo material de baixo atrito.
        translation %<= -0.09*s >% 0 %<= -0.04*s >%
        children [
          Shape { appearance USE BORRACHA geometry USE APOIO }
        ]
        name "apoio_traseiro"
        contactMaterial "apoio"
        boundingObject USE APOIO
        physics Physics { density -1 mass %<= 0.01*massa >% }
      }
    ]
    name "carrinho"
    # Geometria usada nas colisões e massa do corpo principal.
    boundingObject Box { size %<= 0.24*s >% %<= 0.16*s >% %<= 0.06*s >% }
    physics Physics { density -1 mass %<= 0.8*massa >% }
    controller IS controller
    supervisor IS supervisor
  }
}
