<text x="50" y="989" class="small">Vermelho: escadas sem rampa — acesso bloqueado para o carrinho.</text>
<text x="50" y="1020" class="small">Azul: percursos do croqui. Larguras e posições dos ramais ainda aproximadas.</text>
<text x="50" y="1051" class="small">“?”: leitura pendente. A foto aérea complementa a disposição, não prova acessibilidade.</text>
<text x="50" y="1082" class="note">Referência: croqui do usuário, 29/10/2026. Não é levantamento arquitetônico.</text>
